<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Πολιτιστικοί Σύλλογοι Χίου</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
<style>
  :root {
    --ink:#14232d; --muted:#647680; --line:#e3e9ec; --side:#f3f6f7; --card:#fff;
    --accent:#0b6e8f; --accent-ink:#084f67; --accent-soft:#e4f1f5; --radius:14px;
    --shadow:0 1px 2px rgba(20,35,45,.06), 0 4px 14px rgba(20,35,45,.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--side); display: flex; }
  button, input { font: inherit; color: inherit; }
  aside { width: 390px; max-width: 100%; display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--line); box-shadow: 4px 0 24px rgba(20,35,45,.08); z-index: 500; }
  header { padding: 20px 18px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .brand svg { width: 40px; height: 40px; flex: none; padding: 9px; border-radius: 12px; color: #fff; background: linear-gradient(140deg, #1389ad, var(--accent-ink)); }
  h1 { font-size: 18px; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; margin: 0; }
  .tagline { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 13px; top: 50%; width: 17px; height: 17px; margin-top: -8.5px; color: var(--muted); pointer-events: none; }
  #q { width: 100%; padding: 11px 12px 11px 38px; border: 1px solid transparent; border-radius: 12px; background: var(--side); transition: border-color .15s, background .15s, box-shadow .15s; }
  #q::placeholder { color: var(--muted); }
  #q:focus { outline: none; background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; padding: 6px 12px 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  .chip:hover { border-color: #c5d2d8; background: var(--side); }
  .chip:focus-visible, .linkbtn:focus-visible, #back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip[aria-pressed="true"], .chip[aria-pressed="true"]:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c, var(--accent)); }
  #count { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
  #list { list-style: none; margin: 0; padding: 14px 14px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  #list > li { flex: none; padding: 14px 16px 8px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
  #list > li:hover { border-color: #cbd8de; box-shadow: 0 2px 4px rgba(20,35,45,.07), 0 8px 22px rgba(20,35,45,.08); }
  #list > li.empty, #list > li.empty:hover { padding: 28px 18px; text-align: center; color: var(--muted); font-size: 14px; background: none; border: 0; box-shadow: none; }
  .name { font-weight: 700; }
  .village, .place { color: var(--muted); font-size: 13px; }
  .pin { display: flex; align-items: center; gap: 5px; margin-top: 3px; }
  .pin svg { width: 13px; height: 13px; flex: none; }
  .club { font-weight: 700; font-size: 13px; margin-top: 10px; }
  .acts { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13.5px; }
  .acts li { padding: 3px 0; }
  .acts b { font-weight: 700; }
  .when { color: var(--muted); }
  .section { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1.5; padding: 0 7px; border-radius: 999px; background: var(--side); border: 1px solid var(--line); vertical-align: 1px; }
  aside .acts { margin: 10px -8px 0; padding-top: 6px; border-top: 1px solid var(--line); }
  aside .acts li { display: flex; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; transition: background .15s; }
  aside .acts li .dot { margin-top: 6px; }
  aside .acts li:hover, aside .acts li:focus-visible { background: var(--accent-soft); outline: none; }
  .chead { display: flex; align-items: flex-start; gap: 12px; }
  .cmain { flex: 1; min-width: 0; }
  .avatar { position: relative; flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; overflow: hidden; font-size: 15px; font-weight: 800; letter-spacing: .02em; color: #fff; background: var(--c, var(--accent)); }
  .avatar.lg { width: 64px; height: 64px; border-radius: 16px; font-size: 22px; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: inherit; }
  .linkbtn { font-weight: 700; color: var(--ink); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  #list .linkbtn { font-size: 15.5px; line-height: 1.3; display: flex; justify-content: space-between; gap: 10px; width: 100%; }
  #list .linkbtn::after { content: "›"; color: var(--muted); font-size: 20px; line-height: 1; transition: transform .15s, color .15s; }
  #list .linkbtn:hover { color: var(--accent); }
  #list .linkbtn:hover::after { color: var(--accent); transform: translateX(3px); }
  .linkbtn.club { display: block; font-size: 13px; color: var(--accent); }
  .linkbtn.club:hover { text-decoration: underline; }
  #profile { flex: 1; overflow-y: auto; padding: 14px 14px 24px; }
  #back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--accent); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px 7px 11px; cursor: pointer; }
  #back:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-top: 12px; }
  #profile h2 { font-size: 19px; line-height: 1.25; font-weight: 800; letter-spacing: -.01em; margin: 0; }
  #profile h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  #profile p { margin: 12px 0 0; font-size: 14px; white-space: pre-line; }
  .contact { margin: 0 -8px -6px; padding: 0; list-style: none; font-size: 14px; }
  .contact a { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; color: var(--ink); text-decoration: none; transition: background .15s; }
  .contact a:hover, .contact a:focus-visible { background: var(--accent-soft); outline: none; }
  .contact svg { width: 34px; height: 34px; flex: none; padding: 8px; border-radius: 10px; color: var(--accent); background: var(--accent-soft); }
  .contact small { display: block; font-size: 12px; color: var(--muted); }
  .contact b { font-weight: 600; overflow-wrap: anywhere; }
  #profile .acts { border-top: 0; padding-top: 0; margin-top: 0; margin-bottom: -6px; }
  body.in-profile .search, body.in-profile #chips, body.in-profile #count, body.in-profile #list { display: none; }
  body.in-profile .brand { margin-bottom: 0; }
  .brand > div { flex: 1; min-width: 0; }
  .add { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: var(--accent); background: var(--accent-soft); transition: background .15s, color .15s; }
  .add svg { width: 18px; height: 18px; padding: 0; background: none; color: inherit; border-radius: 0; }
  .add:hover, .add:focus-visible { background: var(--accent); color: #fff; outline: none; }
  footer { flex: none; padding: 10px 18px 12px; background: var(--card); border-top: 1px solid var(--line); font-size: 12px; line-height: 1.5; color: var(--muted); }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .cta { display: inline-block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  #map { flex: 1; min-height: 300px; }
  #msg { padding: 16px 18px; color: #8a2b1d; font-size: 14px; }
  .leaflet-container { font-family: inherit; }
  .leaflet-popup-content-wrapper { border-radius: 14px; box-shadow: 0 6px 28px rgba(20,35,45,.2); }
  .leaflet-popup-content { font-size: 14px; line-height: 1.4; margin: 14px 16px; }
  @media (max-width: 760px) {
    body { flex-direction: column-reverse; }
    aside { width: 100%; height: 58%; border-right: 0; border-top: 1px solid var(--line); box-shadow: 0 -4px 24px rgba(20,35,45,.1); }
    #map { flex: none; height: 42%; }
    header { padding: 14px 14px 12px; }
    .brand { margin-bottom: 12px; }
    footer { padding: 8px 14px; }
    footer .cta, footer > div:first-of-type { display: none; }
    #chips { flex-wrap: nowrap; overflow-x: auto; margin-right: -14px; padding-right: 14px; scrollbar-width: none; }
    .chip { flex: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<aside>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.900 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>
      <div><h1>Πολιτιστικοί Σύλλογοι Χίου</h1><div class="tagline">Δραστηριότητες ανά σύλλογο και χώρο</div></div>
      <a class="add" data-add href="#" title="Πρόσθεσε τον σύλλογό σου" aria-label="Πρόσθεσε τον σύλλογό σου"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg>
      <input id="q" type="search" placeholder="Αναζήτηση συλλόγου, χωριού ή χώρου" aria-label="Αναζήτηση συλλόγου, χωριού ή χώρου">
    </div>
    <div id="chips" role="group" aria-label="Φίλτρο ανά δραστηριότητα"></div>
    <div id="count"></div>
  </header>
  <div id="msg" hidden></div>
  <ul id="list"></ul>
  <section id="profile" hidden aria-live="polite"></section>
  <footer>
    <a class="cta" data-add href="#">Πρόσθεσε τον σύλλογό σου</a>
    <div>Τα στοιχεία δίνονται από τους συλλόγους και μπορεί να αλλάξουν.<span id="updated"></span></div>
    <div>Διαχείριση: Homeric Code · <a href="mailto:homericcode@gmail.com">homericcode@gmail.com</a> · <a href="privacy.html">Προστασία δεδομένων</a></div>
  </footer>
</aside>
<div id="map"></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script>
/* ---------- ΡΥΘΜΙΣΗ ----------
   Πηγή δεδομένων: το data.csv δίπλα στη σελίδα, ή ο σύνδεσμος CSV ενός
   δημοσιευμένου Google Sheet (File > Share > Publish to web > CSV).
   Στήλες: σύλλογος, χώρος, διεύθυνση, χωριό, lat, lon, δραστηριότητα, τμήμα, υπεύθυνος, μέρες, ώρες
   (χώρος, διεύθυνση, τμήμα και υπεύθυνος είναι προαιρετικά)
   Μία γραμμή ανά δραστηριότητα. Οι συντεταγμένες είναι του χώρου όπου γίνεται
   η δραστηριότητα· ίδιες συντεταγμένες = ένα σημείο στον χάρτη. */
const DATA_URL = 'data.csv';
/* Προφίλ συλλόγων: syllogoi.csv, μία γραμμή ανά σύλλογο.
   Στήλες: σύλλογος, logo, url, social, email, τηλέφωνο, περιγραφή
   logo = όνομα αρχείου εικόνας μέσα στον φάκελο logos/ (π.χ. pyrgi.png) (όλες προαιρετικές εκτός από το όνομα).
   Το όνομα πρέπει να είναι γραμμένο ακριβώς όπως στο data.csv. */
const PROFILES_URL = 'syllogoi.csv';
const CONTACT_EMAIL = 'homericcode@gmail.com';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Αναζήτηση χωρίς τόνους και κεφαλαία
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ς/g, 'σ').trim();

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = [];
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function buildRows(rows) {
  const head = rows[0].map(norm);
  const col = name => head.indexOf(norm(name));
  const ix = { club: col('σύλλογος'), venue: col('χώρος'), address: col('διεύθυνση'), village: col('χωριό'),
               lat: col('lat'), lon: col('lon'), act: col('δραστηριότητα'), section: col('τμήμα'), lead: col('υπεύθυνος'), days: col('μέρες'), hours: col('ώρες') };
  const optional = ['venue', 'address', 'section', 'lead'];
  const missing = Object.entries(ix).filter(([k, i]) => i < 0 && !optional.includes(k)).map(([k]) => k);
  if (missing.length) throw new Error('Λείπουν στήλες από το αρχείο δεδομένων: ' + missing.join(', '));
  const num = v => parseFloat(String(v).replace(',', '.'));
  const out = [];
  rows.slice(1).forEach(r => {
    const get = k => ix[k] < 0 ? '' : (r[ix[k]] || '').trim();
    const o = { lat: num(get('lat')), lon: num(get('lon')) };
    ['club', 'venue', 'address', 'village', 'act', 'section', 'lead', 'days', 'hours'].forEach(k => o[k] = get(k));
    if (!o.club || !isFinite(o.lat) || !isFinite(o.lon)) return;
    // Ίδιες συντεταγμένες = ίδιος χώρος, άρα ένα σημείο στον χάρτη
    o.key = o.lat.toFixed(5) + ',' + o.lon.toFixed(5);
    out.push(o);
  });
  return out;
}

const CHIOS = L.latLngBounds([38.14, 25.82], [38.61, 26.17]);
const map = L.map('map', { maxBounds: CHIOS.pad(0.25), maxBoundsViscosity: 1, zoomSnap: 0.25 });
map.fitBounds(CHIOS, { animate: false });
map.setMinZoom(map.getZoom());
// Όταν αλλάζει το μέγεθος του παραθύρου, το νησί ξαναχωράει ολόκληρο (εκτός αν ο χρήστης έχει ζουμάρει)
function refit() {
  const atMin = map.getZoom() <= map.getMinZoom() + 0.01;
  map.setMinZoom(0);
  const z = map.getBoundsZoom(CHIOS);
  if (atMin || map.getZoom() < z) map.fitBounds(CHIOS, { animate: false });
  map.setMinZoom(z);
}
map.on('resize', () => setTimeout(refit, 0));
if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
// Μάσκα: καλύπτει ό,τι βρίσκεται έξω από το περίγραμμα της Χίου (chios.geojson, δεδομένα OpenStreetMap)
fetch('chios.geojson').then(r => r.json()).then(g => {
  const hole = g.geometry.coordinates[0].map(([lon, lat]) => [lat, lon]);
  L.polygon([[[20, 5], [20, 45], [55, 45], [55, 5]], hole],
    { stroke: true, color: '#7fa9b8', weight: 1, fillColor: '#aad3df', fillOpacity: 1, interactive: false }).addTo(map);
}).catch(() => {});
const cluster = L.markerClusterGroup({ maxClusterRadius: 40 }).addTo(map);

let rows = [], active = new Set(), profiles = new Map(), current = null;
// Ένα χρώμα ανά δραστηριότητα, ίδιο στα φίλτρα και στις λίστες
const PALETTE = ['#0b6e8f', '#c2553a', '#5b8c3e', '#8a5fb5', '#c9962b', '#2f9c95', '#b54d7e', '#566b8c'];
let actNames = [];
const dot = act => `<span class="dot" style="--c:${PALETTE[Math.max(actNames.indexOf(act), 0) % PALETTE.length]}"></span>`;
const icon = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICONS = {
  pin: '<path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  web: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.600 3.800 9s-1.300 6.400-3.800 9c-2.500-2.600-3.800-5.600-3.800-9S9.500 5.600 12 3z"/>',
  social: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.800-4M8.600 13.500l6.800 4"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.500 7 8.500 6 8.500-6"/>',
  phone: '<path d="M5 4h3.500l1.700 4.300-2.200 1.400a11 11 0 0 0 6.300 6.300l1.400-2.200L20 15.500V19a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>'
};
// Λογότυπο συλλόγου· αν δεν υπάρχει ή δεν φορτώσει, φαίνονται τα αρχικά του σε χρωματιστό φόντο
function avatar(club, large) {
  const words = club.replace(/ΔΕΙΓΜΑ/g, '').split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const initials = words.slice(-2).map(w => w[0]).join('').toUpperCase();
  let h = 0; for (const ch of club) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const file = (profiles.get(club) || {}).logo || '';
  const img = /^[\w.\- ]+\.(png|jpe?g|webp|svg|gif)$/i.test(file) ? `<img src="logos/${encodeURIComponent(file)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  return `<span class="avatar${large ? ' lg' : ''}" style="--c:${PALETTE[h % PALETTE.length]}" aria-hidden="true">${esc(initials)}${img}</span>`;
}
const pinLine = text => text ? `<div class="village pin">${icon(ICONS.pin)}<span>${esc(text)}</span></div>` : '';
const $ = id => document.getElementById(id);
const byClub = (a, b) => a.localeCompare(b, 'el');
const group = (list, key) => list.reduce((m, r) => (m.has(r[key]) || m.set(r[key], []), m.get(r[key]).push(r), m), new Map());
const when = r => r.days || r.hours ? ` <span class="when">· ${esc([r.days, r.hours].filter(Boolean).join(', '))}</span>` : '';
const section = r => r.section ? ` <span class="section">${esc(r.section)}</span>` : '';
const placeName = list => (list.find(r => r.venue) || {}).venue || list[0].village;

function popupHTML(list) {
  const addr = [(list.find(r => r.address) || {}).address, list[0].village].filter(Boolean).join(', ');
  const name = placeName(list);
  let html = `<div class="name">${esc(name)}</div>` + (addr && addr !== name ? `<div class="village">${esc(addr)}</div>` : '');
  [...group(list, 'club')].sort((a, b) => byClub(a[0], b[0])).forEach(([club, acts]) => {
    html += `<button type="button" class="linkbtn club" data-club="${esc(club)}">${esc(club)}</button><ul class="acts">` +
      acts.map(r => `<li><b>${esc(r.act)}</b>${section(r)}${when(r)}</li>`).join('') + '</ul>';
  });
  return html;
}

function render() {
  const q = norm($('q').value);
  const shown = current ? rows.filter(r => r.club === current) : rows.filter(r =>
    (!active.size || active.has(r.act)) &&
    (!q || [r.club, r.village, r.venue, r.address].some(v => norm(v).includes(q))));
  cluster.clearLayers();
  $('list').innerHTML = '';

  const markers = new Map();
  group(shown, 'key').forEach((list, key) => {
    const m = L.marker([list[0].lat, list[0].lon], { title: placeName(list) }).bindPopup(popupHTML(list), { maxHeight: 320, minWidth: 240 });
    markers.set(key, m);
    cluster.addLayer(m);
  });
  const open = key => { const m = markers.get(key); cluster.zoomToShowLayer(m, () => m.openPopup()); };
  const actItem = r => {
    const a = document.createElement('li');
    a.tabIndex = 0;
    const place = [r.venue, r.address, current ? r.village : ''].filter(Boolean).join(', ');
    a.innerHTML = `${dot(r.act)}<div><b>${esc(r.act)}</b>${section(r)}${when(r)}` + (place ? `<div class="place">${esc(place)}</div>` : '') +
      (r.lead ? `<div class="place">Υπεύθυνος/η: ${esc(r.lead)}</div>` : '') + '</div>';
    a.addEventListener('click', () => open(r.key));
    a.addEventListener('keydown', e => { if (e.key === 'Enter') open(r.key); });
    return a;
  };

  document.body.classList.toggle('in-profile', !!current);
  $('profile').hidden = !current;
  if (current) { renderProfile(shown, actItem); return; }

  const clubs = [...group(shown, 'club')].sort((a, b) => byClub(a[0], b[0]));
  clubs.forEach(([club, acts]) => {
    const li = document.createElement('li');
    const villages = [...new Set(acts.map(r => r.village).filter(Boolean))].join(', ');
    li.innerHTML = `<div class="chead">${avatar(club)}<div class="cmain"><button type="button" class="linkbtn" data-club="${esc(club)}"><span>${esc(club)}</span></button>${pinLine(villages)}</div></div>`;
    const ul = document.createElement('ul');
    ul.className = 'acts';
    acts.forEach(r => ul.appendChild(actItem(r)));
    li.appendChild(ul);
    $('list').appendChild(li);
  });
  if (!clubs.length) $('list').innerHTML = '<li class="empty">Δεν βρέθηκαν σύλλογοι με αυτά τα κριτήρια.</li>';
  const n = clubs.length, v = markers.size;
  $('count').textContent = (n === 1 ? '1 σύλλογος' : n + ' σύλλογοι') + ' · ' + (v === 1 ? '1 χώρος' : v + ' χώροι');
}

function renderProfile(acts, actItem) {
  const p = profiles.get(current) || {};
  const el = $('profile');
  // Μόνο http(s) σύνδεσμοι· ό,τι άλλο εμφανίζεται ως απλό κείμενο
  const link = u => /^https?:\/\//i.test(u || '') ? u : (u && !/^[a-z][a-z0-9+.-]*:/i.test(u) ? 'https://' + u : '');
  const short = u => u.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
  const url = link(p.url);
  // Η στήλη social δέχεται έναν ή περισσότερους συνδέσμους, χωρισμένους με κενό ή ;
  const NETWORKS = [['facebook.com', 'Facebook'], ['fb.com', 'Facebook'], ['instagram.com', 'Instagram'], ['youtube.com', 'YouTube'], ['youtu.be', 'YouTube'], ['tiktok.com', 'TikTok'], ['x.com', 'X'], ['twitter.com', 'X']];
  const socials = (p.social || '').split(/[\s;]+/).map(link).filter(Boolean);
  const contact = [];
  const row = (href, ic, label, text, ext) => `<li><a href="${esc(href)}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ''}>${icon(ICONS[ic])}<span><small>${label}</small><b>${esc(text)}</b></span></a></li>`;
  if (url) contact.push(row(url, 'web', 'Ιστοσελίδα', short(url), true));
  socials.forEach(u => {
    const net = NETWORKS.find(([host]) => new RegExp('(^|\\.)' + host.replace('.', '\\.') + '$', 'i').test(short(u).split('/')[0]));
    contact.push(row(u, 'social', net ? net[1] : 'Social media', short(u), true));
  });
  if (p.email) contact.push(row('mailto:' + p.email, 'mail', 'Email', p.email));
  if (p.phone) contact.push(row('tel:' + p.phone.replace(/[^+\d]/g, ''), 'phone', 'Τηλέφωνο', p.phone));
  const villages = [...new Set(acts.map(r => r.village).filter(Boolean))].join(', ');
  el.innerHTML = `<button type="button" id="back"><span aria-hidden="true">←</span> Όλοι οι σύλλογοι</button>
    <div class="pcard"><div class="chead">${avatar(current, true)}<div class="cmain"><h2>${esc(current)}</h2>${pinLine(villages)}</div></div>${p.about ? `<p>${esc(p.about)}</p>` : ''}</div>
    <div class="pcard"><h3>Επικοινωνία</h3>
    ${contact.length ? `<ul class="contact">${contact.join('')}</ul>` : '<div class="village">Δεν έχουν καταχωριστεί στοιχεία επικοινωνίας.</div>'}</div>
    <div class="pcard" id="pacts"><h3>Δραστηριότητες</h3></div>`;
  const ul = document.createElement('ul');
  ul.className = 'acts';
  acts.forEach(r => ul.appendChild(actItem(r)));
  $('pacts').appendChild(ul);
  el.scrollTop = 0;
  $('back').addEventListener('click', () => { location.hash = ''; });
  const b = L.latLngBounds(acts.map(r => [r.lat, r.lon]));
  if (b.isValid()) map.fitBounds(b.pad(0.5), { maxZoom: 14 });
}

// Το προφίλ έχει δικό του σύνδεσμο (#s=όνομα), ώστε να μοιράζεται και να δουλεύει το «πίσω» του browser
function route() {
  let name = null;
  try { name = decodeURIComponent((location.hash.match(/^#s=(.+)$/) || [])[1] || '') || null; } catch (e) {}
  const was = current;
  current = name && rows.some(r => r.club === name) ? name : null;
  map.closePopup();
  render();
  if (was && !current) map.fitBounds(CHIOS);
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-club]');
  if (b) location.hash = 's=' + encodeURIComponent(b.dataset.club);
});

function buildProfiles(table) {
  const head = table[0].map(norm);
  const col = name => head.indexOf(norm(name));
  const ix = { club: col('σύλλογος'), logo: col('logo'), url: col('url'), social: col('social'), email: col('email'), phone: col('τηλέφωνο'), about: col('περιγραφή') };
  const out = new Map();
  if (ix.club < 0) return out;
  table.slice(1).forEach(r => {
    const get = k => ix[k] < 0 ? '' : (r[ix[k]] || '').trim();
    if (get('club')) out.set(get('club'), { logo: get('logo'), url: get('url'), social: get('social'), email: get('email'), phone: get('phone'), about: get('about') });
  });
  return out;
}

function renderChips() {
  const acts = actNames = [...new Set(rows.map(r => r.act).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'el'));
  $('chips').innerHTML = '';
  acts.forEach(a => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.innerHTML = dot(a) + esc(a);
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      active.has(a) ? active.delete(a) : active.add(a);
      b.setAttribute('aria-pressed', String(active.has(a)));
      render();
    });
    $('chips').appendChild(b);
  });
}

$('q').addEventListener('input', render);

fetch(DATA_URL, { cache: 'no-store' })
  .then(r => {
    if (!r.ok) throw new Error('Δεν βρέθηκε το αρχείο δεδομένων (' + r.status + ').');
    const d = new Date(r.headers.get('Last-Modified') || '');
    if (!isNaN(d)) $('updated').textContent = ' Τελευταία ενημέρωση: ' + d.toLocaleDateString('el-GR') + '.';
    return r.text();
  })
  .then(t => {
    rows = buildRows(parseCSV(t));
    // Τα προφίλ είναι προαιρετικά: αν λείπει το αρχείο, ο χάρτης δουλεύει κανονικά
    return fetch(PROFILES_URL, { cache: 'no-store' }).then(r => r.ok ? r.text() : '').catch(() => '')
      .then(p => { if (p.trim()) profiles = buildProfiles(parseCSV(p)); });
  })
  .then(() => { renderChips(); route(); })
  .catch(e => { $('msg').hidden = false; $('msg').textContent = 'Τα δεδομένα δεν φορτώθηκαν. ' + e.message; });
</script>
