<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Πολιτιστικοί Σύλλογοι Χίου</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  :root { --ink:#1d2b36; --muted:#5f6f7a; --line:#dde4e8; --bg:#f6f8f9; --accent:#0b6e8f; --accent-soft:#e3f1f6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); display: flex; }
  aside { width: 360px; max-width: 100%; display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--line); }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 19px; margin: 0 0 10px; }
  #q { width: 100%; padding: 9px 11px; font: inherit; border: 1px solid var(--line); border-radius: 8px; }
  #q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #count { font-size: 13px; color: var(--muted); margin-top: 10px; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list li { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #list li:hover, #list li:focus { background: var(--accent-soft); outline: none; }
  .name { font-weight: 600; }
  .village { color: var(--muted); font-size: 13px; }
  .acts { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .acts li { padding: 2px 0; border: 0; cursor: inherit; }
  .acts b { font-weight: 600; }
  .when { color: var(--muted); }
  #map { flex: 1; min-height: 300px; }
  #msg { padding: 16px; color: #8a2b1d; font-size: 14px; }
  .leaflet-popup-content { font: 14px/1.4 system-ui, sans-serif; margin: 12px 14px; }
  @media (max-width: 760px) {
    body { flex-direction: column-reverse; }
    aside { width: 100%; height: 55%; border-right: 0; border-top: 1px solid var(--line); }
    #map { flex: none; height: 45%; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Πολιτιστικοί Σύλλογοι Χίου</h1>
    <input id="q" type="search" placeholder="Αναζήτηση συλλόγου ή χωριού" aria-label="Αναζήτηση συλλόγου ή χωριού">
    <div id="chips" role="group" aria-label="Φίλτρο ανά δραστηριότητα"></div>
    <div id="count"></div>
  </header>
  <div id="msg" hidden></div>
  <ul id="list"></ul>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
/* ---------- ΡΥΘΜΙΣΗ ----------
   Πηγή δεδομένων: το data.csv δίπλα στη σελίδα, ή ο σύνδεσμος CSV ενός
   δημοσιευμένου Google Sheet (File > Share > Publish to web > CSV).
   Στήλες: σύλλογος, χωριό, lat, lon, δραστηριότητα, μέρες, ώρες
   Μία γραμμή ανά δραστηριότητα. */
const DATA_URL = 'data.csv';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Αναζήτηση χωρίς τόνους και κεφαλαία
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ς/g, 'σ').trim();

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = [];
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function buildClubs(rows) {
  const head = rows[0].map(norm);
  const col = name => head.indexOf(norm(name));
  const ix = { name: col('σύλλογος'), village: col('χωριό'), lat: col('lat'), lon: col('lon'),
               act: col('δραστηριότητα'), days: col('μέρες'), hours: col('ώρες') };
  const missing = Object.entries(ix).filter(([, i]) => i < 0).map(([k]) => k);
  if (missing.length) throw new Error('Λείπουν στήλες από το αρχείο δεδομένων: ' + missing.join(', '));
  const num = v => parseFloat(String(v).replace(',', '.'));
  const map = new Map();
  rows.slice(1).forEach(r => {
    const get = k => (r[ix[k]] || '').trim();
    const name = get('name'), lat = num(get('lat')), lon = num(get('lon'));
    if (!name || !isFinite(lat) || !isFinite(lon)) return;
    const key = name + '|' + get('village');
    if (!map.has(key)) map.set(key, { name, village: get('village'), lat, lon, acts: [] });
    if (get('act')) map.get(key).acts.push({ act: get('act'), days: get('days'), hours: get('hours') });
  });
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'el'));
}

const map = L.map('map').setView([38.40, 26.02], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
const cluster = L.markerClusterGroup({ maxClusterRadius: 40 }).addTo(map);

let clubs = [], active = new Set();
const $ = id => document.getElementById(id);

const actsHTML = c => '<ul class="acts">' + c.acts.map(a =>
  `<li><b>${esc(a.act)}</b>${a.days || a.hours ? ` <span class="when">· ${esc([a.days, a.hours].filter(Boolean).join(', '))}</span>` : ''}</li>`
).join('') + '</ul>';

function render() {
  const q = norm($('q').value);
  const shown = clubs.filter(c =>
    (!q || norm(c.name).includes(q) || norm(c.village).includes(q)) &&
    (!active.size || c.acts.some(a => active.has(a.act))));
  cluster.clearLayers();
  $('list').innerHTML = '';
  shown.forEach(c => {
    const html = `<div class="name">${esc(c.name)}</div><div class="village">${esc(c.village)}</div>${actsHTML(c)}`;
    const m = L.marker([c.lat, c.lon], { title: c.name }).bindPopup(html);
    cluster.addLayer(m);
    const li = document.createElement('li');
    li.tabIndex = 0;
    li.innerHTML = html;
    const open = () => cluster.zoomToShowLayer(m, () => m.openPopup());
    li.addEventListener('click', open);
    li.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
    $('list').appendChild(li);
  });
  $('count').textContent = shown.length === 1 ? '1 σύλλογος' : shown.length + ' σύλλογοι';
}

function renderChips() {
  const acts = [...new Set(clubs.flatMap(c => c.acts.map(a => a.act)))].sort((a, b) => a.localeCompare(b, 'el'));
  $('chips').innerHTML = '';
  acts.forEach(a => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = a;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      active.has(a) ? active.delete(a) : active.add(a);
      b.setAttribute('aria-pressed', String(active.has(a)));
      render();
    });
    $('chips').appendChild(b);
  });
}

$('q').addEventListener('input', render);

fetch(DATA_URL, { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error('Δεν βρέθηκε το αρχείο δεδομένων (' + r.status + ').'); return r.text(); })
  .then(t => { clubs = buildClubs(parseCSV(t)); renderChips(); render(); })
  .catch(e => { $('msg').hidden = false; $('msg').textContent = 'Τα δεδομένα δεν φορτώθηκαν. ' + e.message; });
</script>
</body>
</html>
