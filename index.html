<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Πολιτιστικοί Σύλλογοι Χίου</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  :root { --ink:#1d2b36; --muted:#5f6f7a; --line:#dde4e8; --bg:#f6f8f9; --accent:#0b6e8f; --accent-soft:#e3f1f6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); display: flex; }
  aside { width: 360px; max-width: 100%; display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--line); }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 19px; margin: 0 0 10px; }
  #q { width: 100%; padding: 9px 11px; font: inherit; border: 1px solid var(--line); border-radius: 8px; }
  #q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #count { font-size: 13px; color: var(--muted); margin-top: 10px; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list > li { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
  .name { font-weight: 600; }
  .village, .place { color: var(--muted); font-size: 13px; }
  .club { font-weight: 600; font-size: 13px; margin-top: 8px; }
  .acts { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .acts li { padding: 3px 0; }
  #list .acts li { padding: 6px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; }
  #list .acts li:hover, #list .acts li:focus { background: var(--accent-soft); outline: none; }
  .acts b { font-weight: 600; }
  .when { color: var(--muted); }
  #map { flex: 1; min-height: 300px; }
  #msg { padding: 16px; color: #8a2b1d; font-size: 14px; }
  .leaflet-popup-content { font: 14px/1.4 system-ui, sans-serif; margin: 12px 14px; }
  @media (max-width: 760px) {
    body { flex-direction: column-reverse; }
    aside { width: 100%; height: 55%; border-right: 0; border-top: 1px solid var(--line); }
    #map { flex: none; height: 45%; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Πολιτιστικοί Σύλλογοι Χίου</h1>
    <input id="q" type="search" placeholder="Αναζήτηση συλλόγου, χωριού ή χώρου" aria-label="Αναζήτηση συλλόγου, χωριού ή χώρου">
    <div id="chips" role="group" aria-label="Φίλτρο ανά δραστηριότητα"></div>
    <div id="count"></div>
  </header>
  <div id="msg" hidden></div>
  <ul id="list"></ul>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
/* ---------- ΡΥΘΜΙΣΗ ----------
   Πηγή δεδομένων: το data.csv δίπλα στη σελίδα, ή ο σύνδεσμος CSV ενός
   δημοσιευμένου Google Sheet (File > Share > Publish to web > CSV).
   Στήλες: σύλλογος, χώρος, διεύθυνση, χωριό, lat, lon, δραστηριότητα, μέρες, ώρες
   Μία γραμμή ανά δραστηριότητα. Οι συντεταγμένες είναι του χώρου όπου γίνεται
   η δραστηριότητα· ίδιες συντεταγμένες = ένα σημείο στον χάρτη. */
const DATA_URL = 'data.csv';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Αναζήτηση χωρίς τόνους και κεφαλαία
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ς/g, 'σ').trim();

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = [];
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function buildRows(rows) {
  const head = rows[0].map(norm);
  const col = name => head.indexOf(norm(name));
  const ix = { club: col('σύλλογος'), venue: col('χώρος'), address: col('διεύθυνση'), village: col('χωριό'),
               lat: col('lat'), lon: col('lon'), act: col('δραστηριότητα'), days: col('μέρες'), hours: col('ώρες') };
  const optional = ['venue', 'address'];
  const missing = Object.entries(ix).filter(([k, i]) => i < 0 && !optional.includes(k)).map(([k]) => k);
  if (missing.length) throw new Error('Λείπουν στήλες από το αρχείο δεδομένων: ' + missing.join(', '));
  const num = v => parseFloat(String(v).replace(',', '.'));
  const out = [];
  rows.slice(1).forEach(r => {
    const get = k => ix[k] < 0 ? '' : (r[ix[k]] || '').trim();
    const o = { lat: num(get('lat')), lon: num(get('lon')) };
    ['club', 'venue', 'address', 'village', 'act', 'days', 'hours'].forEach(k => o[k] = get(k));
    if (!o.club || !isFinite(o.lat) || !isFinite(o.lon)) return;
    // Ίδιες συντεταγμένες = ίδιος χώρος, άρα ένα σημείο στον χάρτη
    o.key = o.lat.toFixed(5) + ',' + o.lon.toFixed(5);
    out.push(o);
  });
  return out;
}

const CHIOS = L.latLngBounds([38.14, 25.82], [38.61, 26.17]);
const map = L.map('map', { maxBounds: CHIOS.pad(0.25), maxBoundsViscosity: 1, zoomSnap: 0.25 });
map.fitBounds(CHIOS, { animate: false });
map.setMinZoom(map.getZoom());
// Όταν αλλάζει το μέγεθος του παραθύρου, το νησί ξαναχωράει ολόκληρο (εκτός αν ο χρήστης έχει ζουμάρει)
function refit() {
  const atMin = map.getZoom() <= map.getMinZoom() + 0.01;
  map.setMinZoom(0);
  const z = map.getBoundsZoom(CHIOS);
  if (atMin || map.getZoom() < z) map.fitBounds(CHIOS, { animate: false });
  map.setMinZoom(z);
}
map.on('resize', () => setTimeout(refit, 0));
if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
// Μάσκα: καλύπτει ό,τι βρίσκεται έξω από το περίγραμμα της Χίου (chios.geojson, δεδομένα OpenStreetMap)
fetch('chios.geojson').then(r => r.json()).then(g => {
  const hole = g.geometry.coordinates[0].map(([lon, lat]) => [lat, lon]);
  L.polygon([[[20, 5], [20, 45], [55, 45], [55, 5]], hole],
    { stroke: true, color: '#7fa9b8', weight: 1, fillColor: '#aad3df', fillOpacity: 1, interactive: false }).addTo(map);
}).catch(() => {});
const cluster = L.markerClusterGroup({ maxClusterRadius: 40 }).addTo(map);

let rows = [], active = new Set();
const $ = id => document.getElementById(id);
const byClub = (a, b) => a.localeCompare(b, 'el');
const group = (list, key) => list.reduce((m, r) => (m.has(r[key]) || m.set(r[key], []), m.get(r[key]).push(r), m), new Map());
const when = r => r.days || r.hours ? ` <span class="when">· ${esc([r.days, r.hours].filter(Boolean).join(', '))}</span>` : '';
const placeName = list => (list.find(r => r.venue) || {}).venue || list[0].village;

function popupHTML(list) {
  const addr = [(list.find(r => r.address) || {}).address, list[0].village].filter(Boolean).join(', ');
  const name = placeName(list);
  let html = `<div class="name">${esc(name)}</div>` + (addr && addr !== name ? `<div class="village">${esc(addr)}</div>` : '');
  [...group(list, 'club')].sort((a, b) => byClub(a[0], b[0])).forEach(([club, acts]) => {
    html += `<div class="club">${esc(club)}</div><ul class="acts">` +
      acts.map(r => `<li><b>${esc(r.act)}</b>${when(r)}</li>`).join('') + '</ul>';
  });
  return html;
}

function render() {
  const q = norm($('q').value);
  const shown = rows.filter(r =>
    (!active.size || active.has(r.act)) &&
    (!q || [r.club, r.village, r.venue, r.address].some(v => norm(v).includes(q))));
  cluster.clearLayers();
  $('list').innerHTML = '';

  const markers = new Map();
  group(shown, 'key').forEach((list, key) => {
    const m = L.marker([list[0].lat, list[0].lon], { title: placeName(list) }).bindPopup(popupHTML(list));
    markers.set(key, m);
    cluster.addLayer(m);
  });
  const open = key => { const m = markers.get(key); cluster.zoomToShowLayer(m, () => m.openPopup()); };

  const clubs = [...group(shown, 'club')].sort((a, b) => byClub(a[0], b[0]));
  clubs.forEach(([club, acts]) => {
    const li = document.createElement('li');
    const villages = [...new Set(acts.map(r => r.village).filter(Boolean))].join(', ');
    li.innerHTML = `<div class="name">${esc(club)}</div><div class="village">${esc(villages)}</div>`;
    const ul = document.createElement('ul');
    ul.className = 'acts';
    acts.forEach(r => {
      const a = document.createElement('li');
      a.tabIndex = 0;
      const place = [r.venue, r.address].filter(Boolean).join(', ');
      a.innerHTML = `<b>${esc(r.act)}</b>${when(r)}` + (place ? `<div class="place">${esc(place)}</div>` : '');
      a.addEventListener('click', () => open(r.key));
      a.addEventListener('keydown', e => { if (e.key === 'Enter') open(r.key); });
      ul.appendChild(a);
    });
    li.appendChild(ul);
    $('list').appendChild(li);
  });
  const n = clubs.length, v = markers.size;
  $('count').textContent = (n === 1 ? '1 σύλλογος' : n + ' σύλλογοι') + ' · ' + (v === 1 ? '1 χώρος' : v + ' χώροι');
}

function renderChips() {
  const acts = [...new Set(rows.map(r => r.act).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'el'));
  $('chips').innerHTML = '';
  acts.forEach(a => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = a;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      active.has(a) ? active.delete(a) : active.add(a);
      b.setAttribute('aria-pressed', String(active.has(a)));
      render();
    });
    $('chips').appendChild(b);
  });
}

$('q').addEventListener('input', render);

fetch(DATA_URL, { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error('Δεν βρέθηκε το αρχείο δεδομένων (' + r.status + ').'); return r.text(); })
  .then(t => { rows = buildRows(parseCSV(t)); renderChips(); render(); })
  .catch(e => { $('msg').hidden = false; $('msg').textContent = 'Τα δεδομένα δεν φορτώθηκαν. ' + e.message; });
</script>
</body>
</html>
